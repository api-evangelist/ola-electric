description: 'Ola Electric is an Indian electric-vehicle manufacturer building electric scooters (the S1
  family), electric motorcycles (the Roadster line), and home energy solutions (Ola Shakti battery systems),
  all designed and produced in India around its in-house 4680 Bharat Cell and ferrite-motor technology.
  Backed by SoftBank Vision Fund, the company operates a nationwide Hypercharger fast-charging network and
  Hyperservice center footprint across India. As a consumer EV and energy hardware manufacturer, Ola Electric
  publishes no public developer API, developer portal, SDK, or API reference; this profile is maintained
  in the API Evangelist network as a company identity record rather than an API provider.'
